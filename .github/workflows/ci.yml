name: CI

on:
  # Branches only: a `v*` tag runs these jobs through release.yml, which
  # calls this workflow before it builds the release.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

# A public repository: the token only reads, whoever opened the pull request.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # Apple Silicon runner: the only target platform (vision C1).
    runs-on: macos-15
    steps:
      # Full history and tags: scripts/version.sh counts the commits since
      # vMAJOR.MINOR.0, and the bundle test compares the app's version with it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo nextest run --workspace --locked --no-tests=pass
      - name: Doc tests
        run: cargo test --workspace --locked --doc

  release-tests:
    # M2.7-3 (finding 6): the tests also pass in release builds, where the
    # checked mode's exclusivity tracker is not compiled in.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests (release)
        run: cargo nextest run --workspace --locked --release --no-tests=pass

  lab:
    # M2.7-9: the lab tier (ADR 0015) under clippy and the tests, with
    # `--features signal-cli/lab`, on its own target directory so that it
    # never rebuilds over the default jobs' artifacts. The seat runs these
    # two command lines as they are (crates/signal-cli/tests/ci_lab_job.rs).
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: /tmp/signal-project-target-lab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy (lab)
        run: cargo clippy --workspace --all-targets --locked --features signal-cli/lab -- -D warnings
      - name: Tests (lab)
        run: cargo nextest run --workspace --locked --features signal-cli/lab --no-tests=pass

  model-tests:
    # M2.7-6: the scheduler's gate, task board and parking under loom
    # (`docs/testing-and-evaluation.md`, "Synchronisation model tests"):
    # about 70 s on the seat, so 20 minutes is a generous budget.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RUSTFLAGS: --cfg loom -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Clippy (cfg(loom))
        run: cargo clippy -p signal-engine --lib --tests --locked
      - name: Model tests
        # Quoted: a plain YAML scalar cannot end in `:`.
        run: 'cargo test -p signal-engine --lib --release --locked model::'

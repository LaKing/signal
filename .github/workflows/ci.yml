name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # Apple Silicon runner: the only target platform (vision C1).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo nextest run --workspace --no-tests=pass
      - name: Doc tests
        run: cargo test --workspace --doc

  release-tests:
    # M2.7-3 (finding 6): the tests also pass in release builds, where the
    # checked mode's exclusivity tracker is not compiled in.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests (release)
        run: cargo nextest run --workspace --release --no-tests=pass

  model-tests:
    # M2.7-6: the scheduler's gate, task board and parking under loom
    # (`docs/testing-and-evaluation.md`, "Synchronisation model tests"):
    # about 70 s on the seat, so 20 minutes is a generous budget.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RUSTFLAGS: --cfg loom -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Clippy (cfg(loom))
        run: cargo clippy -p signal-engine --lib --tests
      - name: Model tests
        run: cargo test -p signal-engine --lib --release model::

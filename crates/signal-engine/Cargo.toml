[package]
name = "signal-engine"
description = "Signal engine: per-frame executor, plan swap, fault guards, offline and realtime drivers, generic sink handoff (ADR 0022)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Tests only (M2.7-3): the task hook, the exclusivity counters, the worker
# count and the injected invariant breaks. Off by default; only
# dev-dependencies turn it on (this crate's own below, and its dependants'),
# so no production build can reach them (`tests/test_hooks_scope.rs`).
test-hooks = []

[dependencies]
signal-core = { workspace = true }
signal-graph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# M2: the lock-free SPSC queues between the control and audio threads.
rtrb = { workspace = true }

[dev-dependencies]
# This crate's own tests with its test hooks (feature `test-hooks`).
signal-engine = { path = ".", features = ["test-hooks"] }
# M2.7-6: model tests of the gate, task board and parking (`cfg(loom)`).
loom = { workspace = true }
approx = { workspace = true }
proptest = { workspace = true }
# The counting allocator (ADR 0017) for the executor's no-allocation test.
signal-contract = { workspace = true }
# ADR 0022: the audio adapter, for the tests that render and play (the
# engine itself never depends on it).
signal-output = { workspace = true }
# `tests/offline.rs` reads the WAV files the adapter writes.
hound = { workspace = true }

[lints]
workspace = true

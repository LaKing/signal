[package]
name = "signal-project"
description = "Signal project folders: TOML model, loading, validation, JSON Schema export; session directories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
signal-core = { workspace = true }
signal-graph = { workspace = true }
# ADR 0027 §4: the built-in library that `lib.<name>` references resolve to.
signal-lib = { workspace = true }
# Sessions (`session`): replay renders through the engine, and the recorder
# takes its reports and provenance.
signal-engine = { workspace = true }
# Replay renders through the audio adapter (ADR 0022) and writes its WAV.
signal-output = { workspace = true }
serde = { workspace = true }
# float_roundtrip: edits.jsonl values must read back bit for bit (replay is
# bit-exact); the default parser can be off by one ulp.
serde_json = { workspace = true, features = ["float_roundtrip"] }
toml = { workspace = true }
# Project files (`.signal`): the project folder as one zip (M2.8-12).
zip = { workspace = true }
toml_edit = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
# The standard primitives, for loading and validating real projects in tests.
signal-std = { workspace = true }

[lints]
workspace = true

# Two sine oscillators, summed, into a tanh shaper.
schema_version = 1

[composite]
name = "voice"

[instances]
low = { module = "std.sine_osc" }
high = { module = "std.sine_osc", freq = 441 }
sum = { module = "std.add" }
shaper = { module = "std.tanh_shaper" }

[wiring]
connections = [
  { from = "low.out", to = "sum.a" },
  { from = "high.out", to = "sum.b", scale = 0.5 },
  { from = "sum.out", to = "shaper.in" },
]

[exports]
inputs = { pm = ["low.pm", "high.pm"] }
outputs = { out = "shaper.out" }
parameters = { freq = ["low.freq", "high.freq"], drive = "shaper.drive" }

[package]
name = "signal-audio"
description = "Signal's audio device driver: CoreAudio through cpal behind the engine's driver trait (ADR 0011)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
signal-engine = { workspace = true }
# `Frame` in the input meters.
signal-core = { workspace = true }
cpal = { workspace = true }
# ADR 0019 §4: real-time worker threads (rt_thread.rs only).
objc2-core-audio = { workspace = true }
libc = { workspace = true }
# The callback's stop request and Runner return (one-slot SPSC queues).
rtrb = { workspace = true }
# `signal devices --json`.
serde = { workspace = true }

[dev-dependencies]
# The counting allocator (ADR 0017) for the callback's no-allocation test,
# and a real Runner of the kick project for the callback tests.
signal-contract = { workspace = true }
signal-project = { workspace = true }
signal-std = { workspace = true }

[lints]
workspace = true

[package]
name = "signal-gpu"
description = "Signal's GPU device service (wgpu) and support for GPU-backed modules with declared latency (ADR 0019)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Tests only: a device without a GPU (wgpu's `noop` backend, already in the
# lock). Kernels are validated and jobs travel the whole path, but nothing is
# computed: outputs stay 0. Never selected unless a test asks for it.
noop = ["wgpu/noop"]
# Tests only (M2.7-3): the completion delay that plays a slow GPU. Only
# dev-dependencies turn it on.
test-hooks = []

[dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
# The lock-free SPSC queues between a module and the GPU thread.
rtrb = { workspace = true }

[dev-dependencies]
# This crate's own tests on the noop device, with its test hooks.
signal-gpu = { path = ".", features = ["noop", "test-hooks"] }
# The counting allocator (ADR 0017), for the job path's no-allocation tests.
signal-contract = { workspace = true }

[lints]
workspace = true

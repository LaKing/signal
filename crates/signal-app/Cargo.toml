[package]
name = "signal-app"
description = "Signal.app: a tao window with a wry WebView on the app's own UI server (interface setup, transport, meters, panels) over the engine (ADR 0013, 0023)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "signal-app"
path = "src/main.rs"

[features]
# Test hooks: the server in the app without a socket (in-process clients).
# Only the dev-dependencies below turn it on, with signal-ui's own
# (crates/signal-engine/tests/test_hooks_scope.rs).
test-hooks = []

[dependencies]
signal-core = { workspace = true }
signal-graph = { workspace = true }
signal-project = { workspace = true }
signal-std = { workspace = true }
signal-audio = { workspace = true }
signal-engine = { workspace = true }
# ADR 0022: the audio adapter (the audio runner, the null driver, meters).
signal-output = { workspace = true }
# The Setup, the parameter panel, the player and the app's rules, shared with
# the UI protocol; its host in app mode is the server in the app (M2.8-4).
signal-ui = { workspace = true }
# ADR 0023: the window and its WebView.
wry = { workspace = true }
tao = { workspace = true }
# The native menu bar: File (Open, Save, Save As, Interface setup, Quit).
muda = { workspace = true }
# Open…'s chooser (NSOpenPanel), Save As (NSSavePanel) and the "Save
# changes?" alert (NSAlert), through their safe API.
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
# M2.7-2: the compute inventory in the interface setup (the GPU adapters,
# listed without creating a device) and the Setup's `gpu_devices`.
signal-gpu = { workspace = true }
# The Setup file.
serde = { workspace = true }
toml = { workspace = true }
# A dropped folder's path, quoted for the page.
serde_json = { workspace = true }
# `--setup` and `--project`.
clap = { workspace = true }

[dev-dependencies]
signal-app = { path = ".", features = ["test-hooks"] }
signal-ui = { workspace = true, features = ["test-hooks", "in-process"] }
tungstenite = { workspace = true }

[lints]
workspace = true

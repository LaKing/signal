[package]
name = "signal-app"
description = "Signal.app: the GUI shell (interface setup, metering, panels) over the engine (ADR 0013, 0018)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "signal-app"
path = "src/main.rs"

[dependencies]
signal-core = { workspace = true }
signal-graph = { workspace = true }
signal-project = { workspace = true }
signal-std = { workspace = true }
signal-audio = { workspace = true }
signal-engine = { workspace = true }
# ADR 0022: the audio adapter (the audio runner, the null driver, meters).
signal-output = { workspace = true }
# The Setup, the parameter panel and the player, shared with the UI protocol (M2.8-1).
signal-ui = { workspace = true }
eframe = { workspace = true }
# ADR 0023: the WebView window that replaces eframe at parity (M2.8-4).
wry = { workspace = true }
tao = { workspace = true }
# M2.7-2: the compute inventory in the interface setup (the GPU adapters,
# listed without creating a device) and the Setup's `gpu_devices`.
signal-gpu = { workspace = true }
# The Setup file.
serde = { workspace = true }
toml = { workspace = true }
# `--setup` and `--project`.
clap = { workspace = true }
# Commands and view snapshots between the window and the control thread.
rtrb = { workspace = true }

[lints]
workspace = true

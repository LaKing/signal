[package]
name = "signal-cli"
description = "The `signal` command: render, replay, modules, schema, compare."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "signal"
path = "src/main.rs"

[dependencies]
signal-core = { workspace = true }
signal-graph = { workspace = true }
signal-project = { workspace = true }
signal-std = { workspace = true }
signal-engine = { workspace = true }
signal-eval = { workspace = true }
serde = { workspace = true }
# float_roundtrip: edits.jsonl values must read back bit for bit (replay is
# bit-exact); the default parser can be off by one ulp.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# session.toml (`signal replay`, docs/session-format.md).
toml = { workspace = true }
clap = { workspace = true }
# To tell an I/O failure writing audio.wav (exit 1) from another (exit 2);
# the integration tests also read the WAV header with it.
hound = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true

[package]
name = "signal-cli"
description = "The `signal` command: render, replay, play, bench, devices, modules, schema, compare."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "signal"
path = "src/main.rs"

[features]
# ADR 0015: the lab tier (`lab.*` primitives; M2.6-4: `lab.gpu_partials`), and
# `signal bench`'s GPU partial bank. Without it nothing here links wgpu.
lab = ["dep:signal-lab", "signal-lab/lab", "dep:signal-gpu"]

[dependencies]
signal-core = { workspace = true }
signal-graph = { workspace = true }
signal-project = { workspace = true }
signal-std = { workspace = true }
signal-engine = { workspace = true }
signal-eval = { workspace = true }
# `signal play` and `signal devices`: the CoreAudio driver (cpal stays inside it).
signal-audio = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
# To tell an I/O failure writing audio.wav (exit 1) from another (exit 2);
# the integration tests also read the WAV header with it.
hound = { workspace = true }
# `--features lab`: the lab primitives, and the GPU device for `signal bench`.
signal-lab = { workspace = true, optional = true }
signal-gpu = { workspace = true, optional = true }

[dev-dependencies]
# The engine's exclusivity counters for the determinism matrices.
signal-engine = { workspace = true, features = ["test-hooks"] }
insta = { workspace = true }

[lints]
workspace = true

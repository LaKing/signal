[package]
name = "signal-cli"
description = "The `signal` command: render, replay, play, bench, devices, modules, schema, compare."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "signal"
path = "src/main.rs"

[features]
# M2.7-2: the GPU devices: `signal devices --compute` lists the GPU adapters,
# and runs place GPU-backed instances on the devices the Setup's
# `gpu_devices` allows. Without it (the default build) nothing here links
# wgpu (AC2b, decision of 2026-10-14).
gpu = ["dep:signal-gpu", "dep:toml"]
# ADR 0015: the lab tier (`lab.*` primitives; M2.6-4: `lab.gpu_partials`), and
# `signal bench`'s GPU partial bank, with the GPU devices.
lab = ["dep:signal-lab", "signal-lab/lab", "gpu"]

[dependencies]
signal-core = { workspace = true }
signal-graph = { workspace = true }
signal-project = { workspace = true }
signal-std = { workspace = true }
signal-engine = { workspace = true }
# ADR 0022: the audio adapter (render, the null driver, the audio runner).
signal-output = { workspace = true }
signal-eval = { workspace = true }
# `signal ui` (M2.8-1): the UI protocol and local server.
signal-ui = { workspace = true }
# `signal play` and `signal devices`: the CoreAudio driver (cpal stays inside it).
signal-audio = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
# To tell an I/O failure writing audio.wav (exit 1) from another (exit 2);
# the integration tests also read the WAV header with it.
hound = { workspace = true }
# `--features lab`: the lab primitives. `--features gpu` (in `lab`): the GPU
# devices, and the Setup's `gpu_devices` (read with `toml`).
signal-lab = { workspace = true, optional = true }
signal-gpu = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
# The engine's exclusivity counters for the determinism matrices.
signal-engine = { workspace = true, features = ["test-hooks"] }
insta = { workspace = true }
# A client for `signal ui`'s protocol.
tungstenite = { workspace = true }

[lints]
workspace = true

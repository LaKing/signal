# The session test project (M2-2), version 1: a second tone added, and the
# first one's frequency changed in the file.
schema_version = 1

[project]
name = "session"
sample_rate = 8000
seed = 3

[instances]
osc = { module = "std.sine_osc", freq = 470 }
osc2 = { module = "std.sine_osc", freq = 660 }
# The two oscillators meet in a sum (ADR 0054: one connection per input).
left = { module = "std.add" }
env = { module = "std.exp_env" }
out = { module = "std.audio_out", gain = 0.5 }

[wiring]
connections = [
  { from = "osc.out", to = "left.a" },
  { from = "osc2.out", to = "left.b", scale = 0.5 },
  { from = "left.out", to = "out.l" },
  { from = "env.out", to = "out.r" },
]

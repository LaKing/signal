[package]
name = "signal-lib"
description = "The built-in library (ADR 0027 §4): composites shipped with Signal, referenced as `lib.<name>`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The content hash (FNV-1a 64, as the render manifest's file hashes).
signal-core = { workspace = true }

[dev-dependencies]
# The library composites loaded, planned and rendered through the engine:
# the pinned render hashes, the bounds test and the checks of every file.
signal-project = { workspace = true }
signal-std = { workspace = true }
signal-engine = { workspace = true }
signal-output = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

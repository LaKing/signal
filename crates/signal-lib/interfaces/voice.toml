# A mono voice: a pitch, a gate and a velocity in, one audio output
# (ADR 0037 §3). `moog_voice` of the studio projects matches it exactly.
schema_version = 1

[interface]
name = "voice"
description = "A mono voice: plays `hz` while `gate` is high, at `velocity` (0 to 1); one audio output."

[inputs]
hz = { kind = "frequency", unit = "Hz", group = "note" }
gate = { kind = "gate", group = "note" }
velocity = { kind = "control", range = [0, 1], group = "note" }

[outputs]
out = { kind = "audio" }

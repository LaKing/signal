  { from = "counter_next.out", to = "counter.in" },
  # from_next: attack ? (done ? 1 : F) : decay ? Fd : release ? Fr : F
  { from = "attack_done.out", to = "from_attack.gate" },
  { from = "one.out", to = "from_attack.a" },
  { from = "from0.out", to = "from_attack.b" },
  { from = "is_release.out", to = "from_rn.gate" },
  { from = "release_from.out", to = "from_rn.a" },
  { from = "from0.out", to = "from_rn.b" },
  { from = "decaying.out", to = "from_dn.gate" },
  { from = "decay_from.out", to = "from_dn.a" },
  { from = "from_rn.out", to = "from_dn.b" },
  { from = "is_attack.out", to = "from_next.gate" },
  { from = "from_attack.out", to = "from_next.a" },
  { from = "from_dn.out", to = "from_next.b" },
  { from = "from_next.out", to = "from.in" },
  # factor_next: attack ? 1 : decay ? E·qd : release ? E·qr : 1
  { from = "is_release.out", to = "factor_rn.gate" },
  { from = "release_next.out", to = "factor_rn.a" },
  { from = "one.out", to = "factor_rn.b" },
  { from = "decaying.out", to = "factor_dn.gate" },
  { from = "decay_next.out", to = "factor_dn.a" },
  { from = "factor_rn.out", to = "factor_dn.b" },
  { from = "is_attack.out", to = "factor_next.gate" },
  { from = "one.out", to = "factor_next.a" },
  { from = "factor_dn.out", to = "factor_next.b" },
  { from = "factor_next.out", to = "factor.in" },
]

[exports]
inputs = { gate = "on.a", trigger = "triggers.trigger" }
outputs = { out = "out.out" }

# Each exported parameter with its own range (ADR 0042).
[exports.parameters]
attack_ms = { to = "attack.value", min = 0, max = 60000 }

  { from = "level.out", to = "sustain_same.b" },
  { from = "is_sustain.out", to = "holding.a" },
  { from = "sustain_same.out", to = "holding.b" },
  { from = "decay_continue.out", to = "decay_from.gate" },
  { from = "level.out", to = "decay_from.a" },
  { from = "from0.out", to = "decay_from.b" },
  { from = "decay_continue.out", to = "decay_factor.gate" },
  { from = "decay_q.out", to = "decay_factor.a" },
  { from = "factor0.out", to = "decay_factor.b" },
  { from = "decay_from.out", to = "decay_head.a" },
  { from = "decay_factor.out", to = "decay_head.b" },
  { from = "one.out", to = "decay_rest.a" },
  { from = "decay_factor.out", to = "decay_rest.b" },
  { from = "sustain_lim.out", to = "decay_tail.a" },
  { from = "decay_rest.out", to = "decay_tail.b" },
  { from = "decay_head.out", to = "decay_value.a" },
  { from = "decay_tail.out", to = "decay_value.b" },
  { from = "decay_value.out", to = "decay_gap.a" },
  { from = "sustain_lim.out", to = "decay_gap.b" },
  { from = "decay_gap.out", to = "decay_gap_abs.in" },

  { from = "is_attack.out", to = "out.gate" },
  { from = "attack_out.out", to = "out.a" },
  { from = "out_d.out", to = "out.b" },
  { from = "out.out", to = "level.in" },
  # stage_next
  { from = "holding.out", to = "to_sustain.a" },
  { from = "decay_reached.out", to = "to_sustain.b" },
  { from = "attack_done.out", to = "stage_attack.gate" },
  { from = "two.out", to = "stage_attack.a" },
  { from = "one.out", to = "stage_attack.b" },
  { from = "to_sustain.out", to = "stage_decay.gate" },
  { from = "three.out", to = "stage_decay.a" },
  { from = "two.out", to = "stage_decay.b" },
  { from = "release_ended.out", to = "stage_release.gate" },

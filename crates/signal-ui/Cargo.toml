[package]
name = "signal-ui"
description = "Signal's UI protocol and local server: HTTP for the UI files, a WebSocket for describe, subscribe and edit (ADR 0023)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test hooks: hold a client's writer, so a stalled client is deterministic.
test-hooks = []

[dependencies]
signal-core = { workspace = true }
signal-graph = { workspace = true }
signal-engine = { workspace = true }
# The audio and scope adapters, the null driver (ADR 0022).
signal-output = { workspace = true }
# Projects, the live reload, the parameter write (toml_edit), sessions.
signal-project = { workspace = true }
# Devices, the CoreAudio driver and input capture (the Setup's Apply).
signal-audio = { workspace = true }
# The Setup file.
serde = { workspace = true }
toml = { workspace = true }
# The protocol's control messages.
serde_json = { workspace = true }
tiny_http = { workspace = true }
tungstenite = { workspace = true }

[dev-dependencies]
signal-ui = { path = ".", features = ["test-hooks"] }
signal-std = { workspace = true }

[lints]
workspace = true

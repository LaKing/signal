[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false      # ADR 0014: all rights reserved, unpublished

[workspace.lints.rust]
unsafe_code = "deny"            # exceptions need an ADR and an audited module
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

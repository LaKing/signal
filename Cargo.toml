[workspace]
resolver = "3"
members = ["crates/*", "lab"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false      # ADR 0014: all rights reserved, unpublished

# Every dependency is declared here once, pinned by Cargo.lock, and fetched by
# ./install.sh. devpanel seats build offline, so they cannot add new crates:
# adding one is an operator change (edit here, run ./install.sh). ADR 0014: permissive licences only.
[workspace.dependencies]
signal-core = { path = "crates/signal-core" }
signal-graph = { path = "crates/signal-graph" }
signal-project = { path = "crates/signal-project" }
signal-std = { path = "crates/signal-std" }
signal-engine = { path = "crates/signal-engine" }
signal-output = { path = "crates/signal-output" }
signal-eval = { path = "crates/signal-eval" }
signal-contract = { path = "crates/signal-contract" }
signal-audio = { path = "crates/signal-audio" }
signal-gpu = { path = "crates/signal-gpu" }
# ADR 0015: experimental primitives (`lab/`); they compile in only with its `lab` feature.
signal-lab = { path = "lab" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"
toml_edit = "0.25.17"
schemars = "1.2.2"
hound = "3.5.1"
realfft = "3.5.0"
libm = "0.2.16"
clap = { version = "4.6.7", features = ["derive"] }
# M2: real time (ADR 0011: cpal pinned behind the driver trait; lock-free SPSC queues between threads)
cpal = "=0.18.2"
rtrb = "0.4.0"
# M2.5: Signal.app GUI (ADR 0018)
eframe = "0.36.2"
# M2.6 (ADR 0019): GPU device (wgpu, already locked through eframe) and real-time worker threads (rt_thread.rs only)
wgpu = "30.0.1"
pollster = "1.0.1"
objc2-core-audio = "0.3.2"
libc = "0.2.190"
# M2.7-6: model tests of the scheduler's synchronisation (dev-dependency of signal-engine only)
loom = "0.7.2"
# test-only
proptest = "1.12.0"
insta = "1.49.0"
approx = "0.5.1"

[workspace.lints.rust]
unsafe_code = "deny"            # exceptions need an ADR and an audited module
missing_docs = "warn"
# M2.7-6: `--cfg loom` builds signal-engine's model tests of the scheduler.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

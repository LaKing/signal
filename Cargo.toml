[workspace]
resolver = "3"
members = ["crates/*", "lab"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"   # ADR 0031; the text is LICENSE
publish = false      # ADR 0031: not on crates.io

# Every dependency is declared here once, pinned by Cargo.lock, and fetched by
# ./install.sh. devpanel seats build offline, so they cannot add new crates:
# adding one is an operator change (edit here, run ./install.sh). ADR 0031: dependencies stay
# permissive (MIT, Apache-2.0, BSD, ISC, Zlib, Unicode; MPL-2.0 with a note; never GPL);
# scripts/third-party-notices.mjs checks the linked ones and writes THIRD-PARTY-NOTICES.md.
[workspace.dependencies]
signal-core = { path = "crates/signal-core" }
signal-graph = { path = "crates/signal-graph" }
signal-project = { path = "crates/signal-project" }
signal-std = { path = "crates/signal-std" }
# ADR 0027 §4: the built-in library (`lib.*` composites shipped with Signal).
signal-lib = { path = "crates/signal-lib" }
signal-engine = { path = "crates/signal-engine" }
signal-output = { path = "crates/signal-output" }
signal-eval = { path = "crates/signal-eval" }
signal-contract = { path = "crates/signal-contract" }
signal-audio = { path = "crates/signal-audio" }
signal-gpu = { path = "crates/signal-gpu" }
signal-ui = { path = "crates/signal-ui" }
# ADR 0015: experimental primitives (`lab/`); they compile in only with its `lab` feature.
signal-lab = { path = "lab" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"
toml_edit = "0.25.17"
schemars = "1.2.2"
hound = "3.5.1"
realfft = "3.5.0"
libm = "0.2.16"
clap = { version = "4.6.7", features = ["derive"] }
# M2: real time (ADR 0011: cpal pinned behind the driver trait; lock-free SPSC queues between threads)
cpal = "=0.18.2"
rtrb = "0.4.0"
# M2.6 (ADR 0019): GPU device (wgpu) and real-time worker threads (rt_thread.rs; ADR 0036: device_props.rs reads a device's shared state)
wgpu = "30.0.1"
pollster = "1.0.1"
objc2-core-audio = "0.3.2"
libc = "0.2.190"
# M2.7-6: model tests of the scheduler's synchronisation (dev-dependency of signal-engine only)
loom = "0.7.2"
# M2.8 (ADR 0023): the web UI: local server (signal-ui) and the app's WebView (signal-app)
tungstenite = "0.30.0"
wry = "0.57.0"
tao = "0.37.1"
# The app's native menu bar (File, …) for the tao window (MIT/Apache-2.0, tauri-apps).
muda = { version = "0.21.2", default-features = false }
# The native folder chooser (NSOpenPanel), Save As (NSSavePanel) and the "Save changes?"
# alert (NSAlert with its buttons; M2.8-12), safe API only: already locked through tao and
# muda, so these features add no package to Cargo.lock.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }
# Project files (`.signal`, a zip of the project folder; owner's request 2026-10-16). MIT; only
# deflate through flate2 and zlib-rs, which muda already locked.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# test-only
proptest = "1.12.0"
insta = "1.49.0"
approx = "0.5.1"

[workspace.lints.rust]
unsafe_code = "deny"            # exceptions need an ADR and an audited module
missing_docs = "warn"
# M2.7-6: `--cfg loom` builds signal-engine's model tests of the scheduler.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

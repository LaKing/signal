<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The kick panel's knob skin (docs/ui-controls.md "Skins"): a matte
       body on a ring of eleven scale dots over the 270° sweep. The part
       "pointer" is drawn at 12 o'clock and turned about (32, 32). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f48"/>
      <stop offset="1" stop-color="#1d2026"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3038"/>
      <stop offset="1" stop-color="#23262d"/>
    </linearGradient>
  </defs>
  <g fill="#6d7584">
    <circle cx="11.85" cy="52.15" r="1.4"/>
    <circle cx="4.89" cy="40.81" r="0.9"/>
    <circle cx="3.85" cy="27.54" r="0.9"/>
    <circle cx="8.94" cy="15.25" r="0.9"/>
    <circle cx="19.06" cy="6.61" r="0.9"/>
    <circle cx="32" cy="3.5" r="1.4"/>
    <circle cx="44.94" cy="6.61" r="0.9"/>
    <circle cx="55.06" cy="15.25" r="0.9"/>
    <circle cx="60.15" cy="27.54" r="0.9"/>
    <circle cx="59.11" cy="40.81" r="0.9"/>
    <circle cx="52.15" cy="52.15" r="1.4"/>
  </g>
  <circle cx="32" cy="33" r="23" fill="#0c0d10" opacity="0.6"/>
  <circle cx="32" cy="32" r="22.5" fill="url(#body)" stroke="#0f1013" stroke-width="1"/>
  <circle cx="32" cy="32" r="18" fill="url(#face)"/>
  <g data-part="pointer" data-cx="32" data-cy="32">
    <line x1="32" y1="11.5" x2="32" y2="21" stroke="#f2a65a" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>

<!doctype html>
<!-- The kick's panel (docs/ui-controls.md "Panels"): a grid of cards with
     the decay and drive of the kick (an SVG knob skin, ui/assets/knob.svg),
     the output gain, the output meters and a scope of the kick. Moving a
     control commits its value to project.toml on release; this file never
     changes. `signal ui check projects/kick` checks its bindings. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kick</title>
<link rel="stylesheet" href="/ui/controls/theme.css">
<style>
  :root { color-scheme: dark; --signal-accent: #f2a65a; --signal-knob-size: 88px; }
  body { margin: 0; padding: 0.75rem; background: var(--signal-bg); color: var(--signal-fg); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  .signal-card > h1 { font-size: 18px; letter-spacing: .02em; text-transform: none; color: var(--signal-fg); }
  .scope signal-scope { width: 100%; }
</style>
</head>
<body>
<signal-panel>
  <div class="signal-cards">
    <section class="signal-card">
      <h1>kick</h1>
      <p>A techno kick on a 132 bpm grid; an LFO moves the decay and the accent pushes the drive.</p>
    </section>
    <section class="signal-card">
      <h2>kick</h2>
      <div class="row">
        <signal-knob bind="/drums.kick_decay" taper="log" min="100" max="1500" label="decay" skin="svg:assets/knob.svg"></signal-knob>
        <signal-knob bind="/drums.kick_drive" taper="log" min="0.5" max="8" label="drive" skin="svg:assets/knob.svg"></signal-knob>
      </div>
    </section>
    <section class="signal-card">
      <h2>output</h2>
      <div class="row">
        <signal-fader bind="/out.gain" taper="db" label="gain"></signal-fader>
        <signal-meter bind="/out.l" label="L"></signal-meter>
        <signal-meter bind="/out.r" label="R"></signal-meter>
      </div>
    </section>
    <section class="signal-card wide scope">
      <h2>scope</h2>
      <signal-scope bind="/drums/kick/dc.out" rate="24000" label="kick"></signal-scope>
    </section>
  </div>
</signal-panel>
<script type="module">
import '/ui/controls/index.js';
</script>
</body>
</html>

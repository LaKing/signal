# One bar of drums; the form decides which lanes are heard.
schema_version = 1
kind = "steps"
steps = 16
step = 0.25

[lanes]
kick = "X...x...X...x.x."
snare = "....x.......x..."
clap = "....X.......X..x"
chh = "x.xxx.x.x.xxx.xx"
ohh = "..x...x...x...x."

[levels]
kick = 0.9
snare = 0.55
clap = 0.6
chh = 0.4
ohh = 0.45

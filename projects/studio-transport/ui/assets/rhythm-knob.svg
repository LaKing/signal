<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The rhythm composer's knob: a small grey knob with an orange index on
       a dark scale. The part "pointer" is drawn at 12 o'clock and turned
       about (32, 32). -->
  <defs>
    <linearGradient id="grey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d6cf"/>
      <stop offset="1" stop-color="#8f8b84"/>
    </linearGradient>
  </defs>
  <g fill="#3a3732">
    <circle cx="11.85" cy="52.15" r="1.3"/>
    <circle cx="3.85" cy="27.54" r="0.9"/>
    <circle cx="19.06" cy="6.61" r="0.9"/>
    <circle cx="32" cy="3.5" r="1.3"/>
    <circle cx="44.94" cy="6.61" r="0.9"/>
    <circle cx="60.15" cy="27.54" r="0.9"/>
    <circle cx="52.15" cy="52.15" r="1.3"/>
  </g>
  <circle cx="32" cy="33" r="21" fill="#000" opacity="0.35"/>
  <circle cx="32" cy="32" r="20" fill="url(#grey)" stroke="#5e5a54" stroke-width="1"/>
  <g data-part="pointer" data-cx="32" data-cy="32">
    <line x1="32" y1="13" x2="32" y2="25" stroke="#f26b1d" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

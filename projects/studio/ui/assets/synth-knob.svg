<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The mono synth's knob (docs/ui-controls.md "Skins"): a black skirted
       knob with a ribbed cap and a white index line, on a white scale. The
       part "pointer" is drawn at 12 o'clock and turned about (32, 32). -->
  <defs>
    <radialGradient id="skirt" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3b3b3b"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <g fill="#e8e4d8">
    <circle cx="11.85" cy="52.15" r="1.3"/>
    <circle cx="3.85" cy="27.54" r="0.9"/>
    <circle cx="19.06" cy="6.61" r="0.9"/>
    <circle cx="32" cy="3.5" r="1.3"/>
    <circle cx="44.94" cy="6.61" r="0.9"/>
    <circle cx="60.15" cy="27.54" r="0.9"/>
    <circle cx="52.15" cy="52.15" r="1.3"/>
  </g>
  <circle cx="32" cy="33.5" r="25" fill="#000" opacity="0.5"/>
  <g data-part="pointer" data-cx="32" data-cy="32">
    <circle cx="32" cy="32" r="24" fill="url(#skirt)" stroke="#000" stroke-width="1"/>
    <circle cx="32" cy="32" r="16" fill="url(#cap)" stroke="#444" stroke-width="0.8" stroke-dasharray="1.2 1.6"/>
    <line x1="32" y1="9" x2="32" y2="22" stroke="#f4f1e8" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The tape echo's knob: a black chicken-head pointer knob over a cream
       dial with a numbered-style scale. The part "pointer" is drawn pointing
       up and turned about (32, 34). -->
  <circle cx="32" cy="34" r="27" fill="#efe6cc" stroke="#b9ad8a" stroke-width="1"/>
  <g fill="#3d4a3a">
    <circle cx="13.6" cy="52.4" r="1.4"/>
    <circle cx="7.1" cy="34" r="1"/>
    <circle cx="13.6" cy="15.6" r="1"/>
    <circle cx="32" cy="8" r="1.4"/>
    <circle cx="50.4" cy="15.6" r="1"/>
    <circle cx="56.9" cy="34" r="1"/>
    <circle cx="50.4" cy="52.4" r="1.4"/>
  </g>
  <g data-part="pointer" data-cx="32" data-cy="34">
    <circle cx="32" cy="35.5" r="11" fill="#000" opacity="0.35"/>
    <path d="M32 11 L40 30 A10 10 0 1 1 24 30 Z" fill="#161616" stroke="#000" stroke-width="1"/>
    <line x1="32" y1="14" x2="32" y2="27" stroke="#efe6cc" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>

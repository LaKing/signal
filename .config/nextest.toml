# cargo-nextest profiles. CI sets NEXTEST_PROFILE=ci (.github/workflows/ci.yml).

[profile.ci]
# Report every failure of a run, not only the first.
fail-fast = false
# Three tests measure real-time scheduling, which a hosted runner (a 3-core
# virtual machine) cannot give: the Mach-semaphore workers under a time
# constraint did not play 16 384 frames in 120 s; workers under a time
# constraint took no task in a release build, three tries running (the
# caller ran every task before they woke); and a 108 ms stall of the virtual
# machine was reported as a hang (the threshold is 100 ms). They run on the
# device: `cargo test` and the default nextest profile run them.
default-filter = """
not (
    (binary_id(signal-audio::rt_workers) & test(=semaphore_workers_are_reached_by_every_wake_and_stop_cleanly))
  | (binary_id(signal-audio::rt_workers) & test(=time_constraint_workers_play_the_offline_render))
  | (binary_id(signal-output::hang) & test(=a_run_without_a_stall_reports_no_hang))
)
"""

# A test that times the host passes on the device, but only by a margin a
# loaded virtual machine sometimes misses: a hidden edit was shown after
# 2.30 s against a 2.25 s bound. It runs, with retries; nextest reports a
# pass after a retry as flaky.
[[profile.ci.overrides]]
filter = "binary_id(signal-ui::document) & test(=the_display_shows_a_hidden_edit_within_the_bound)"
retries = 2

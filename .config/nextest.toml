# cargo-nextest profiles. CI sets NEXTEST_PROFILE=ci (.github/workflows/ci.yml).

[profile.ci]
# Report every failure of a run, not only the first.
fail-fast = false
# Some tests time the host or its GPU and pass on the device, but only by a
# margin a loaded virtual machine sometimes misses (seen: 4 096 frames run
# before any worker woke; a GPU result pending one block after the lab bank
# had recovered). Every test gets two retries here; a deterministic failure
# still fails all three, and nextest reports a pass after a retry as flaky, so
# it stays visible.
retries = 2
# Three tests time the host more closely than a hosted runner (a 3-core
# virtual machine) can: the Mach-semaphore workers under a time constraint
# did not play 16 384 frames in 120 s; workers under a time constraint took
# no task in a release build, three tries running (the caller ran every task
# before they woke); a 108 ms stall of the virtual machine was reported as a
# hang (the threshold is 100 ms). They run on the device: `cargo test` and
# the default nextest profile run them. (A fourth, the display's hidden-edit
# bound, missed 2.25 s by 50 ms three tries running in run 39962042041; it
# now awaits the edit with a 30 s deadline and runs here too.)
default-filter = """
not (
    (binary_id(signal-audio::rt_workers) & test(=semaphore_workers_are_reached_by_every_wake_and_stop_cleanly))
  | (binary_id(signal-audio::rt_workers) & test(=time_constraint_workers_play_the_offline_render))
  | (binary_id(signal-output::hang) & test(=a_run_without_a_stall_reports_no_hang))
)
"""

# Tests that skip at run time (no GPU adapter: CI's hosted runners have
# none) pass with a `SKIPPED` line; their output is shown on success too, so
# the CI log says what did not run.
[[profile.ci.overrides]]
filter = "binary_id(signal-gpu::service) | package(signal-lab) | (binary_id(signal-cli::lab) & test(=devices_compute_lists_the_gpu_adapters))"
success-output = "final"

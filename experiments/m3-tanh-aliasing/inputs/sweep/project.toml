# M3 tanh aliasing experiment (experiments/m3-tanh-aliasing/README.md): a sine
# swept exponentially from 100 Hz to 10 kHz over 8 s, through the shaper at
# drive 20. render.sh swaps `std.tanh_shaper` for each candidate in a copy.
schema_version = 1

[project]
name = "m3-sweep"
sample_rate = 48000
seed = 1

[instances]
clock = { module = "std.frames" }
# f(t) = 100 Hz · e^(t·ln(100)/8 s), t = frames / 48000: ln(100)/(8·48000).
rate = { module = "std.scale", mul = 1.1992630692677323e-5, add = 0 }
expo = { module = "std.exp" }
osc = { module = "std.sine_osc", freq = 0 }
shaper = { module = "std.tanh_shaper", drive = 20 }
# Quiet: the peak stays at or below 0.25 (the oversampled candidates overshoot
# a clipped wave by up to about 1.3×).
out = { module = "std.audio_out", gain = 0.18 }

[wiring]
connections = [
  { from = "clock.lo", to = "rate.in" },
  { from = "rate.out", to = "expo.in" },
  { from = "expo.out", to = "osc.freq", scale = 100 },
  { from = "osc.out", to = "shaper.in" },
  { from = "shaper.out", to = "out.l" },
  { from = "shaper.out", to = "out.r" },
]

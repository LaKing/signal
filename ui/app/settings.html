<!doctype html>
<!-- Signal.app's Settings window (ADR 0034): Signal ▸ Settings… (⌘,), and
     Help ▸ Keyboard Shortcuts (?view=reference: the shortcuts as a
     reference first). One page for now, Keyboard Shortcuts; the sidebar
     takes more. Every change is written to the person's keys.toml beside
     the Setup at once (`keys.set`, `keys.reset`, docs/ui-protocol.md), and
     an edit of that file elsewhere shows here at once. The URL's fragment
     carries the WebSocket's port and the session token. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal — Settings</title>
<link rel="stylesheet" href="../controls/theme.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<nav class="pages" aria-label="Settings">
  <button type="button" class="page" aria-current="page">Keyboard Shortcuts</button>
</nav>
<main>
  <signal-settings-keys></signal-settings-keys>
</main>
<script type="module">
import { connectFromPage, setDefaultConnection } from '../signal-ui.js';
import './settings.js';

const connection = connectFromPage();
if (connection) setDefaultConnection(connection);
else document.querySelector('main').prepend(Object.assign(document.createElement('p'), { className: 'error', textContent: 'This page needs the URL Signal.app or `signal ui` opens (#ws=…&token=…); the built-in keys are shown.' }));
</script>
</body>
</html>

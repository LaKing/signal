<!doctype html>
<!-- Signal.app's window (ADR 0023 §2, M2.8-4, M2.8-11): one page. The
     toolbar (power switch, the tabs Signal Project | Parameters | Setup,
     the status), then the tabs, switched without a reload or
     a new connection: the Signal Project (ADR 0051: one plane,
     <signal-plane>, filling the tab: the Setup level with the project's
     Stacks and this machine's peripherals, a Stack's live front panels,
     the board below them), the parameters (status, meters, messages, the
     snapshots and the parameter list, as cards) and the setup (the project folder and the
     interface setup). Only the shown tab scrolls, as one container. The
     page URL's fragment carries the WebSocket's port and the session token
     (docs/ui-protocol.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal</title>
<link rel="stylesheet" href="../controls/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<signal-app-toolbar></signal-app-toolbar>
<main>
<section class="tab tab-fill" data-tab="plane" role="tabpanel" aria-label="Signal Project">
  <signal-plane></signal-plane>
</section>
<section class="tab tab-scroll" data-tab="parameters" role="tabpanel" aria-label="Parameters" hidden>
  <div class="signal-cards">
    <section class="signal-card"><h2>Status</h2><signal-app-status></signal-app-status></section>
    <section class="signal-card"><h2>Meters</h2><signal-app-meters></signal-app-meters></section>
    <section class="signal-card"><h2>Messages</h2><signal-app-messages></signal-app-messages></section>
    <section class="signal-card wide"><h2>Snapshots</h2><signal-app-snapshots></signal-app-snapshots></section>
    <signal-app-parameters></signal-app-parameters>
  </div>
</section>
<section class="tab tab-scroll" data-tab="setup" role="tabpanel" aria-label="Setup" hidden>
  <div class="signal-cards">
    <section class="signal-card wide"><h2>Project</h2><signal-app-project></signal-app-project></section>
    <section class="signal-card wide"><h2>Interface setup</h2><signal-app-setup></signal-app-setup></section>
  </div>
</section>
</main>
<signal-app-context-menu></signal-app-context-menu>
<script type="module">
import { connectFromPage, setDefaultConnection } from '../signal-ui.js';
import './app.js';
import './setup.js';

const connection = connectFromPage();
if (connection) setDefaultConnection(connection);
else document.querySelector('main').prepend(Object.assign(document.createElement('p'), { className: 'error', textContent: 'This page needs the URL Signal.app or `signal ui` opens (#ws=…&token=…).' }));
</script>
</body>
</html>

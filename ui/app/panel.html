<!doctype html>
<!-- Signal.app's shell around the project's panel (M2.8-3, M2.8-4): the
     menu (Open project, Interface setup, Quit, with their shortcuts) and,
     below it, /project/main.html in a same-origin frame with the same
     fragment (the WebSocket's port and the session token). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal — panel</title>
<link rel="stylesheet" href="../controls/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="with-panel">
<signal-app-menu></signal-app-menu>
<signal-app-messages></signal-app-messages>
<signal-app-panel></signal-app-panel>
<script type="module">
import { connectFromPage, setDefaultConnection } from '../signal-ui.js';
import './app.js';

const connection = connectFromPage();
if (connection) setDefaultConnection(connection);
else document.body.prepend(Object.assign(document.createElement('p'), { className: 'error', textContent: 'This page needs the URL Signal.app or `signal ui` opens (#ws=…&token=…).' }));
</script>
</body>
</html>

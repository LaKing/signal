<!doctype html>
<!-- Signal.app's interface setup (the M2.5-1 dialog, now web; M2.8-4):
     devices by stable id, rates, buffer, channel map, input, CPU workers,
     wake policy and the compute devices, saved in the Setup file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal — interface setup</title>
<link rel="stylesheet" href="../controls/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<signal-app-menu></signal-app-menu>
<h2>Interface setup</h2>
<signal-app-setup></signal-app-setup>
<script type="module">
import { connectFromPage, setDefaultConnection } from '../signal-ui.js';
import './app.js';
import './setup.js';

const connection = connectFromPage();
if (connection) setDefaultConnection(connection);
else document.body.prepend(Object.assign(document.createElement('p'), { className: 'error', textContent: 'This page needs the URL Signal.app or `signal ui` opens (#ws=…&token=…).' }));
</script>
</body>
</html>

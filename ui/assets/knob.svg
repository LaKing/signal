  </defs>
  <circle cx="32" cy="32" r="29" fill="#111317" stroke="#3a414d" stroke-width="1"/>
  <g stroke="#6b7484" stroke-width="1.5" stroke-linecap="round">
    <line x1="11.8" y1="52.2" x2="9.7" y2="54.3"/>
    <line x1="52.2" y1="52.2" x2="54.3" y2="54.3"/>
    <line x1="32" y1="5" x2="32" y2="2"/>
    <line x1="5" y1="32" x2="2" y2="32"/>
    <line x1="59" y1="32" x2="62" y2="32"/>

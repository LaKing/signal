<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 220" width="48" height="220">
  <!-- A fader skin: the part "thumb" is drawn at the top of its travel and
       moved down by the control, up to data-travel (180) units. -->
  <rect x="0.5" y="0.5" width="47" height="219" rx="4" fill="#15171b" stroke="#2c313b"/>
  <rect x="22" y="20" width="4" height="180" rx="2" fill="#050607"/>
  <g stroke="#3d4450" stroke-width="1">
    <line x1="8" y1="20" x2="16" y2="20"/><line x1="8" y1="65" x2="14" y2="65"/>
    <line x1="8" y1="110" x2="16" y2="110"/><line x1="8" y1="155" x2="14" y2="155"/>
    <line x1="8" y1="200" x2="16" y2="200"/>
  </g>
  <g data-part="thumb" data-travel="180">
    <rect x="8" y="10" width="32" height="20" rx="3" fill="#c9ced6" stroke="#0b0c0e"/>
    <rect x="8" y="19" width="32" height="2" fill="#ff7043"/>
  </g>
  <text data-part="value" x="24" y="214" text-anchor="middle" font-size="8" fill="#8a93a3"></text>
</svg>
